<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sneetches — marquee promo tile 1400x560</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0;
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 18px;
    line-height: 1.7;
  }
  body {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 50px 80px;
    box-sizing: border-box;
    column-gap: 60px;
  }
  .brand-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .logo { width: 96px; height: 96px; flex-shrink: 0; }
  .wordmark {
    font-size: 76px;
    font-weight: 700;
    color: #e6edf3;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .tagline {
    font-size: 22px;
    color: #8b949e;
    max-width: 520px;
  }
  ul.sample {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul.sample li {
    margin: 8px 0;
    color: #c9d1d9;
  }
  ul.sample a {
    color: #2f81f7;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  ul.sample a:visited { color: #2f81f7; }
</style>
</head>
<body>
  <div class="brand-stack">
    <div class="brand">

      <div class="wordmark">Sneetches</div>
    </div>

  </div>

  <ul class="sample">
    <li><a href="https://github.com/torvalds/linux">torvalds/linux</a> - Linux kernel</li>

</html>
