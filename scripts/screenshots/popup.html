<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sneetches popup — framed</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0d1117;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    display: block;
    /* Raw popup screenshot is 676x776 from Kevin's capture. Render at
       natural pixel dimensions so the chip/text inside stays crisp. The
       surrounding #0d1117 canvas fills the 1040x1020 viewport around it. */
    width: 676px;
    height: 776px;
  }
</style>
</head>
<body>
  <img src="popup-raw.png" alt="Sneetches popup" />
</body>
</html>
